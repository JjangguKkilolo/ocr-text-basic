# Student aid word lists for the second masking net. The first net (the application values given and the identity
# value shapes) is in ocr_text_basic/mask.py and no key here can unmask it. The lists are fixed; a word is not added
# for one form.
# identity labels: the words after them are masked until a kept word, or an amount once a value was masked
identity_labels: [성명, 이름, 학번, 학생번호, 수험번호, 생년월일, 주민등록번호, 주민번호, 계좌, 계좌번호, 예금주, 연락처, 전화, 휴대폰, 주소,
                  이메일, 전자우편, 사번, 직원번호, 외국인등록번호, 출생]
# words that open a masked segment after them
labels: [발급, 문서번호, 학생, 대상, 직원, 신청인, 보호자, 담당]
# school, institution and department names are not masked
# kept: field words anywhere in a word, term words at the start of a word or after a number, item suffixes
keep_words: [학년도, 분기, 항목, 금액, 경비, 비용, 합계, 내역, 납부, 납입, 수납, 고지, 입금, 분납]
keep_term_words: [학기]
keep_item_suffixes: [비, 료, 금, 수당]
